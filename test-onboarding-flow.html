<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Onboarding Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Onboarding Flow</h1>
    
    <div class="section">
        <h2>Step 1: Simulate OAuth Token Storage</h2>
        <p>This simulates what happens after successful OAuth callback</p>
        <button onclick="simulateOAuthSuccess()">Simulate OAuth Success</button>
        <button onclick="clearTokens()">Clear Tokens</button>
        <div id="tokenStatus"></div>
    </div>

    <div class="section">
        <h2>Step 2: Test Server Token Validation</h2>
        <button onclick="testServerValidation()">Test Server Validation</button>
        <div id="serverValidation"></div>
    </div>

    <div class="section">
        <h2>Step 3: Test Onboarding Submission</h2>
        <input type="text" id="shopName" placeholder="Shop Name" value="Test Shop">
        <input type="text" id="subdomain" placeholder="Subdomain" value="testshop123">
        <button onclick="testOnboardingSubmission()">Submit Onboarding</button>
        <div id="onboardingResult"></div>
    </div>

    <div class="section">
        <h2>Debug Info</h2>
        <button onclick="showDebugInfo()">Show Debug Info</button>
        <pre id="debugInfo"></pre>
    </div>

    <script>
        const BASE_URL = 'https://eshop.clubemkt.digital';
        
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            element.innerHTML += `<div class="${className}">${new Date().toLocaleTimeString()}: ${message}</div>`;
        }

        function simulateOAuthSuccess() {
            // This simulates a real JWT token (this is a test token, not valid)
            const testToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoxNzM5MDY0MDAwLCJpYXQiOjE3MzkwNjA0MDAsImlzcyI6Imh0dHBzOi8vemFsZXJpc3Vzb2JqY2thb2RrZmIuc3VwYWJhc2UuY28vYXV0aC92MSIsInN1YiI6IjEyMzQ1Njc4LTEyMzQtMTIzNC0xMjM0LTEyMzQ1Njc4OTAxMiIsImVtYWlsIjoidGVzdEBleGFtcGxlLmNvbSIsInBob25lIjoiIiwiYXBwX21ldGFkYXRhIjp7InByb3ZpZGVyIjoiZ29vZ2xlIiwicHJvdmlkZXJzIjpbImdvb2dsZSJdfSwidXNlcl9tZXRhZGF0YSI6e30sInJvbGUiOiJhdXRoZW50aWNhdGVkIiwiYWFsIjoiYWFsMSIsImFtciI6W3sibWV0aG9kIjoib2F1dGgiLCJ0aW1lc3RhbXAiOjE3MzkwNjA0MDB9XSwic2Vzc2lvbl9pZCI6IjEyMzQ1Njc4LTEyMzQtMTIzNC0xMjM0LTEyMzQ1Njc4OTAxMiJ9.test-signature';
            
            localStorage.setItem('sb-access-token', testToken);
            localStorage.setItem('sb-refresh-token', 'test-refresh-token');
            
            log('tokenStatus', 'OAuth tokens stored successfully', 'success');
            showTokenStatus();
        }

        function clearTokens() {
            localStorage.removeItem('sb-access-token');
            localStorage.removeItem('sb-refresh-token');
            log('tokenStatus', 'Tokens cleared', 'info');
            showTokenStatus();
        }

        function showTokenStatus() {
            const accessToken = localStorage.getItem('sb-access-token');
            const refreshToken = localStorage.getItem('sb-refresh-token');
            
            log('tokenStatus', `Access Token: ${accessToken ? 'Present (' + accessToken.length + ' chars)' : 'Missing'}`, accessToken ? 'success' : 'error');
            log('tokenStatus', `Refresh Token: ${refreshToken ? 'Present' : 'Missing'}`, refreshToken ? 'success' : 'error');
        }

        async function testServerValidation() {
            const accessToken = localStorage.getItem('sb-access-token');
            
            if (!accessToken) {
                log('serverValidation', 'No access token found. Run Step 1 first.', 'error');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/api/debug-tokens`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                const data = await response.json();
                log('serverValidation', `Server Response (${response.status}):`, 'info');
                log('serverValidation', JSON.stringify(data, null, 2), 'info');
                
                if (data.hasAuthHeader) {
                    log('serverValidation', 'Server received Authorization header ✓', 'success');
                } else {
                    log('serverValidation', 'Server did not receive Authorization header ✗', 'error');
                }
                
                if (data.supabaseError) {
                    log('serverValidation', `Supabase Error: ${data.supabaseError}`, 'error');
                }
                
            } catch (error) {
                log('serverValidation', `Request failed: ${error.message}`, 'error');
            }
        }

        async function testOnboardingSubmission() {
            const accessToken = localStorage.getItem('sb-access-token');
            const shopName = document.getElementById('shopName').value;
            const subdomain = document.getElementById('subdomain').value;
            
            if (!accessToken) {
                log('onboardingResult', 'No access token found. Run Step 1 first.', 'error');
                return;
            }

            if (!shopName || !subdomain) {
                log('onboardingResult', 'Please fill in shop name and subdomain', 'error');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('shopName', shopName);
                formData.append('subdomain', subdomain);

                log('onboardingResult', 'Submitting onboarding form...', 'info');
                
                const response = await fetch(`${BASE_URL}/onboarding`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: formData
                });

                const responseText = await response.text();
                log('onboardingResult', `Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                // Try to parse as JSON first
                try {
                    const jsonData = JSON.parse(responseText);
                    log('onboardingResult', 'Response Data:', 'info');
                    log('onboardingResult', JSON.stringify(jsonData, null, 2), 'info');
                    
                    if (jsonData.success) {
                        log('onboardingResult', 'Onboarding successful! ✓', 'success');
                    } else if (jsonData.error) {
                        log('onboardingResult', `Error: ${jsonData.error}`, 'error');
                    }
                } catch (e) {
                    // If not JSON, show first 500 chars of response
                    log('onboardingResult', 'Response (first 500 chars):', 'info');
                    log('onboardingResult', responseText.substring(0, 500), 'info');
                }
                
            } catch (error) {
                log('onboardingResult', `Request failed: ${error.message}`, 'error');
            }
        }

        function showDebugInfo() {
            const debugInfo = {
                currentUrl: window.location.href,
                localStorage: {
                    'sb-access-token': localStorage.getItem('sb-access-token') ? 'Present' : 'Missing',
                    'sb-refresh-token': localStorage.getItem('sb-refresh-token') ? 'Present' : 'Missing'
                },
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };
            
            document.getElementById('debugInfo').textContent = JSON.stringify(debugInfo, null, 2);
        }

        // Initialize
        showTokenStatus();
    </script>
</body>
</html>
