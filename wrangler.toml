# Cloudflare Workers configuration for ClubeeShopMkt
name = "clubeeshopmkt"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Main entry point
main = "build/server/index.js"

# Assets directory for static files
[site]
bucket = "./build/client"

# Environment variables (secrets should be set via wrangler secret)
[vars]
ENVIRONMENT = "development"

# Hyperdrive binding for Supabase connection pooling
# To configure:
# 1. Create Hyperdrive in Cloudflare dashboard
# 2. Connect to Supabase using Supavisor port 6543 (Transaction Mode)
# 3. Uncomment and add your Hyperdrive ID below
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-id>"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Local development variables (use .dev.vars for secrets)
# Create a .dev.vars file with:
# SUPABASE_URL=https://your-project.supabase.co
# SUPABASE_ANON_KEY=your-anon-key

# Production environment
[env.production]
name = "clubeeshopmkt-production"
[env.production.vars]
ENVIRONMENT = "production"

# Staging environment
[env.staging]
name = "clubeeshopmkt-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
