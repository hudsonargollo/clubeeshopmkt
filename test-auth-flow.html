<!DOCTYPE html>
<html>
<head>
    <title>Test Authentication Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; }
        input { padding: 8px; margin: 5px; width: 200px; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Authentication Flow Test</h1>
    
    <div class="test-section">
        <h2>Step 1: Create Test User</h2>
        <form id="createUserForm">
            <div>
                <label>Email:</label>
                <input type="email" id="email" value="test@example.com" required>
            </div>
            <div>
                <label>Password:</label>
                <input type="password" id="password" value="testpass123" required>
            </div>
            <div>
                <label>Shop Name:</label>
                <input type="text" id="shopName" value="Test Shop">
            </div>
            <div>
                <label>Subdomain:</label>
                <input type="text" id="subdomain" value="testshop">
            </div>
            <button type="submit">Create Test User</button>
        </form>
        <div id="createResult" class="log"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Test Login</h2>
        <form id="loginForm">
            <div>
                <label>Email:</label>
                <input type="email" id="loginEmail" value="test@example.com" required>
            </div>
            <div>
                <label>Password:</label>
                <input type="password" id="loginPassword" value="testpass123" required>
            </div>
            <button type="submit">Test Login</button>
        </form>
        <div id="loginResult" class="log"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Test Backoffice Access</h2>
        <button onclick="testBackofficeAccess()">Test Backoffice Access</button>
        <div id="backofficeResult" class="log"></div>
    </div>

    <script>
        const baseUrl = 'https://eshop.clubemkt.digital';
        
        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            element.textContent += `[${timestamp}] ${message}\n`;
            element.parentElement.className = isError ? 'test-section error' : 'test-section success';
        }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('createResult');
            resultDiv.textContent = '';
            
            try {
                const formData = new FormData();
                formData.append('action', 'create-test-user');
                formData.append('email', document.getElementById('email').value);
                formData.append('password', document.getElementById('password').value);
                formData.append('shopName', document.getElementById('shopName').value);
                formData.append('subdomain', document.getElementById('subdomain').value);

                log('createResult', 'Creating test user...');
                
                const response = await fetch(`${baseUrl}/test-user`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    log('createResult', `✅ User created successfully!`);
                    log('createResult', `Email: ${result.userDetails.email}`);
                    log('createResult', `User ID: ${result.userDetails.userId}`);
                    log('createResult', `Tenant ID: ${result.userDetails.tenantId}`);
                    log('createResult', `Subdomain: ${result.userDetails.subdomain}`);
                    
                    // Update login form with created user details
                    document.getElementById('loginEmail').value = result.userDetails.email;
                } else {
                    log('createResult', `❌ Error: ${result.error}`, true);
                }
            } catch (error) {
                log('createResult', `❌ Network error: ${error.message}`, true);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('loginResult');
            resultDiv.textContent = '';
            
            try {
                const formData = new FormData();
                formData.append('email', document.getElementById('loginEmail').value);
                formData.append('password', document.getElementById('loginPassword').value);

                log('loginResult', 'Testing login...');
                
                const response = await fetch(`${baseUrl}/login`, {
                    method: 'POST',
                    body: formData
                });

                if (response.redirected) {
                    log('loginResult', `✅ Login successful! Redirected to: ${response.url}`);
                } else {
                    const result = await response.json();
                    if (result.error) {
                        log('loginResult', `❌ Login error: ${result.error}`, true);
                    } else {
                        log('loginResult', `✅ Login response received`);
                    }
                }
            } catch (error) {
                log('loginResult', `❌ Network error: ${error.message}`, true);
            }
        });

        async function testBackofficeAccess() {
            const resultDiv = document.getElementById('backofficeResult');
            resultDiv.textContent = '';
            
            try {
                log('backofficeResult', 'Testing backoffice access...');
                
                const response = await fetch(`${baseUrl}/backoffice`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.ok) {
                    log('backofficeResult', `✅ Backoffice accessible! Status: ${response.status}`);
                } else if (response.status === 401) {
                    log('backofficeResult', `❌ Unauthorized (401) - Authentication required`, true);
                } else if (response.status === 403) {
                    log('backofficeResult', `❌ Forbidden (403) - Access denied`, true);
                } else {
                    log('backofficeResult', `❌ Error: ${response.status} ${response.statusText}`, true);
                }
            } catch (error) {
                log('backofficeResult', `❌ Network error: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
